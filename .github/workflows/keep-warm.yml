name: Manual backend health check

# Manual fallback health check for the Cloud Run backend. Scheduled execution is
# disabled because the judging deployment currently keeps one instance ready.
# This touches no application code; it only calls /api/health.
#
# Run it manually from GitHub Actions only when an explicit health check is useful.
# After the judging window, return Cloud Run to min-instances=0 if scale-to-zero
# cost behavior is preferred.

on:
  workflow_dispatch: {}       # manual only — run from the Actions tab if needed
  # schedule:
  #   - cron: '*/5 * * * *'   # (disabled) every 5 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the backend
        run: |
          curl -fsS --max-time 60 \
            https://nestiq-api-603719952072.us-central1.run.app/api/health \
            || echo "warm ping failed (non-fatal)"
